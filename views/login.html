<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UNA Chat · Iniciar sesión</title>
    <style>
      :root {
        --una: #c8102e;
        --una-oscuro: #9e0c24;
        --superficie: #ffffff;
        --texto: #1f2933;
        --suave: #6b7280;
        --borde: #e3e6ea;
      }
      @media (prefers-color-scheme: dark) {
        :root { --superficie: #1a1f25; --texto: #e6e8eb; --suave: #9aa3ad; --borde: #2a3139; }
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: var(--texto);
        min-height: 100vh;
        display: flex; align-items: center; justify-content: center;
        padding: 24px 16px;
        background: radial-gradient(1200px 600px at 10% -10%, #e2475f 0%, transparent 60%),
                    linear-gradient(160deg, var(--una) 0%, var(--una-oscuro) 55%, #4a0612 100%);
      }
      .tarjeta { background: var(--superficie); border-radius: 18px; box-shadow: 0 20px 50px rgba(0, 0, 0, .25); padding: 36px 30px 28px; width: 100%; max-width: 400px; text-align: center; }
      .logo { width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 16px; background: var(--una); color: #fff; display: grid; place-items: center; font-size: 26px; font-weight: 800; box-shadow: 0 6px 16px rgba(200, 16, 46, .35); }
      h1 { font-size: 26px; margin-bottom: 6px; }
      p { color: var(--suave); }
      .boton { display: block; margin-top: 24px; background: var(--una); color: #fff; text-decoration: none; font-weight: 700; padding: 13px 22px; border-radius: 999px; transition: background .15s, transform .15s; }
      .boton:hover, .boton:focus-visible { background: var(--una-oscuro); transform: translateY(-1px); }
      .boton:focus-visible { outline: 3px solid rgba(200, 16, 46, .35); outline-offset: 2px; }
      .alerta { margin-top: 18px; padding: 10px 12px; border-radius: 10px; background: #fdecea; color: #b42318; border: 1px solid #f9c9c4; font-weight: 600; }
      .pie { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--borde); font-size: 12px; color: var(--suave); }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main class="tarjeta">
      <div class="logo" aria-hidden="true">U</div>
      <h1>UNA Chat</h1>
      <p id="descripcion">Para usar el chat, iniciá sesión con tu cuenta de una red social. No necesitás crear otra contraseña.</p>
      <p id="error" class="alerta" role="alert" hidden></p>
      <a id="accion" class="boton" href="/login">Iniciar sesión</a>
      <p class="pie">Universidad Nacional · Paradigmas de Programación</p>
    </main>
    <script>
      // Mensajes fijos por codigo: nunca se muestra texto que venga de la URL
      var MENSAJES_ERROR = {
        cancelled: 'Cancelaste el inicio de sesión.',
        failed: 'No se pudo iniciar sesión. Intentá de nuevo.'
      };

      function mensajeParaCodigo(codigo) {
        return Object.prototype.hasOwnProperty.call(MENSAJES_ERROR, codigo)
          ? MENSAJES_ERROR[codigo]
          : MENSAJES_ERROR.failed;
      }

      (function () {
        var params = new URLSearchParams(window.location.search);
        if (!params.has('auth_error')) { return; }

        var error = document.getElementById('error');
        error.textContent = mensajeParaCodigo(params.get('auth_error'));
        error.hidden = false;
        document.getElementById('accion').textContent = 'Reintentar';
      })();
    </script>
  </body>
</html>
