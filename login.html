<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UNA Chat · Iniciar sesión</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font: 15px Helvetica, Arial, sans-serif; background: #f2f4f7; color: #1f2933; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
      .tarjeta { background: #fff; border-radius: 10px; box-shadow: 0 4px 18px rgba(0,0,0,.08); padding: 32px 28px; width: 100%; max-width: 380px; text-align: center; }
      h1 { font-size: 24px; margin-bottom: 8px; }
      p { color: #52606d; line-height: 1.4; }
      .boton { display: inline-block; margin-top: 22px; background: rgb(130, 224, 255); color: #000; text-decoration: none; font-weight: bold; padding: 12px 22px; border-radius: 6px; }
      .boton:focus, .boton:hover { background: rgb(100, 205, 245); }
      .alerta { margin-top: 18px; padding: 10px 12px; border-radius: 6px; background: #fdecea; color: #b42318; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main class="tarjeta">
      <h1>UNA Chat</h1>
      <p id="descripcion">Para usar el chat, iniciá sesión con tu cuenta de una red social.</p>
      <p id="error" class="alerta" role="alert" hidden></p>
      <a id="accion" class="boton" href="/login">Iniciar sesión</a>
    </main>
    <script>
      // Mensajes fijos por codigo: nunca se muestra texto que venga de la URL
      var MENSAJES_ERROR = {
        cancelled: 'Cancelaste el inicio de sesión.',
        failed: 'No se pudo iniciar sesión. Intentá de nuevo.'
      };

      function mensajeParaCodigo(codigo) {
        return Object.prototype.hasOwnProperty.call(MENSAJES_ERROR, codigo)
          ? MENSAJES_ERROR[codigo]
          : MENSAJES_ERROR.failed;
      }

      (function () {
        var params = new URLSearchParams(window.location.search);
        if (!params.has('auth_error')) { return; }

        var error = document.getElementById('error');
        error.textContent = mensajeParaCodigo(params.get('auth_error'));
        error.hidden = false;
        document.getElementById('accion').textContent = 'Reintentar';
      })();
    </script>
  </body>
</html>
