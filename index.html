<!doctype html>
<html>
  <head>
    <title>Chat Socket.IO UNA</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font: 13px Helvetica, Arial; }
      #estado { position: fixed; top: 0; left: 0; width: 100%; padding: 6px 10px; text-align: center; font-weight: bold; color: #fff; }
      #estado.conectado { background: #2e7d32; }
      #estado.desconectado { background: #c62828; }
      #messages { list-style-type: none; margin: 0; padding: 0; padding-top: 30px; }
      #messages li { padding: 5px 10px; }
      #messages li:nth-child(odd) { background: #eee; }
      #messages li .hora { color: #888; font-size: 11px; margin-left: 6px; }
      #messages li.propio { background: #d7f0ff; }
      #messages { margin-bottom: 40px }
      #messages li img, #messages li video, #messages li iframe { display: block; margin-top: 5px; border-radius: 4px; }
      form { background: #000; padding: 3px; position: fixed; bottom: 0; width: 100%; }
      form input { border: 0; padding: 10px;}
      form button { width: 10%; background: rgb(130, 224, 255);  border: none; padding: 10px; }
      form button:disabled { opacity: 0.5; cursor: not-allowed; }
      #nombre, #m { display: inline-block;}
      #m {width: 69%; margin-right: 4px;}
      #nombre {width: 20%}
    </style>
  </head>
  <body>
    <div id="estado" class="desconectado">Desconectado</div>
    <ul id="messages"></ul>
    <form action="">
      <input id="nombre" autocomplete="off" placeholder="Username"/>
      <input id="m" autocomplete="off" placeholder="Escriba un mensaje" /><button id="enviar" disabled>Send</button>
    </form>
    <script src="https://cdn.socket.io/4.7.2/socket.io.js"></script>
    <script src="https://code.jquery.com/jquery-1.11.1.js"></script>
    <script>

    var colorHexTxt = "";
    var NOMBRE_KEY = "chat_ux_nombre";

    // genera colores aleatorios en hexadeximal
    function getRandomColor() {
        var letters = '0123456789ABCDEF';
        var color = '#';
        for (var i = 0; i < 6; i++) {
          color += letters[Math.floor(Math.random() * 16)];
        }

        return color;
     }

    // devuelve true si el texto (sin espacios) tiene contenido
    function tieneContenido(texto) {
        return typeof texto === "string" && texto.trim().length > 0;
    }

    // formatea una fecha como HH:MM
    function formatearHora(fecha) {
        var h = fecha.getHours();
        var m = fecha.getMinutes();
        if (h < 10) { h = "0" + h; }
        if (m < 10) { m = "0" + m; }
        return h + ":" + m;
    }

      $(function () {
        var socket = io();
        var nombreGuardado = window.localStorage ? window.localStorage.getItem(NOMBRE_KEY) : null;

        // estado de conexion
        function actualizarEstado(conectado) {
            var $estado = $('#estado');
            if (conectado) {
                $estado.text('Conectado').removeClass('desconectado').addClass('conectado');
            } else {
                $estado.text('Desconectado').removeClass('conectado').addClass('desconectado');
            }
        }

        socket.on('connect', function () { actualizarEstado(true); });
        socket.on('disconnect', function () { actualizarEstado(false); });
        socket.on('connect_error', function () { actualizarEstado(false); });

        // restaura el nombre guardado
        if (nombreGuardado) {
            $('#nombre').val(nombreGuardado);
        }

        // feedback visual del boton segun el contenido
        function actualizarBoton() {
            $('#enviar').prop('disabled', !tieneContenido($('#m').val()));
        }

        $('#m').on('input', actualizarBoton);
        actualizarBoton();

        // emite evento al servidor
        $('form').submit(function(){
            var nombreTxt = $('#nombre').val() || "Anomimo";
            var mensajeTxt = $('#m').val();

            // bloquea mensajes vacios o solo con espacios
            if (!tieneContenido(mensajeTxt)) {
                return false;
            }

            if (colorHexTxt == "") {
                colorHexTxt = getRandomColor();
            }

            // persiste el nombre en el navegador
            if (window.localStorage) {
                window.localStorage.setItem(NOMBRE_KEY, nombreTxt);
            }

            var jsonMsg = { nombre: nombreTxt, mensaje: mensajeTxt, color: colorHexTxt };
            socket.emit('Evento-Mensaje-Server', JSON.stringify(jsonMsg));
            $('#m').val('');
            actualizarBoton();
            $('#m').focus();
            return false;
        });

        // ... (resto del código) ...

        socket.on('Evento-Mensaje-Server', function(msg){
            var msgJson = JSON.parse(msg);

            // valida que el color sea un hex valido, si no, usa uno por defecto
            var colorSeguro = /^#[0-9A-Fa-f]{6}$/.test(msgJson.color) ? msgJson.color : "#000000";

            // el nombre se inserta como texto (no HTML) para evitar inyeccion
            var $nombre = $('<b>').css('color', colorSeguro).text(msgJson.nombre);

            // el mensaje viene sanitizado por el servidor (texto escapado o tag de media seguro)
            var $li = $('<li>').append($nombre).append(document.createTextNode(': '));
            $li.append(msgJson.mensaje);

            // hora local del mensaje
            $li.append($('<span>').addClass('hora').text(formatearHora(new Date())));

            // marca visualmente los mensajes propios
            if (nombreGuardado && msgJson.nombre === nombreGuardado) {
                $li.addClass('propio');
            }

            $('#messages').append($li);
            window.scrollTo(0, document.body.scrollHeight);
        });

      });
    </script>
  </body>
</html>
